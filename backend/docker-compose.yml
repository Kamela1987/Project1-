services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monze
      POSTGRES_PASSWORD: monze
      POSTGRES_DB: monze_ride
    ports:
      - "5432:5432"
    volumes:
      - monze_postgres_data:/var/lib/postgresql/data

  # Backs Phase 2 live location tracking (src/realtime/) — a fast,
  # short-TTL cache of each online driver's last-known position.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  monze_postgres_data:
