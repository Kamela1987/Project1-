# Render blueprint for one-click deploy: https://render.com/docs/blueprint-spec
# On render.com: New -> Blueprint -> point at this repo -> Render finds this
# file automatically (it looks in the repo root, so copy/symlink it there,
# or set "Root Directory" to monze_farm_link when creating the service by
# hand instead of via blueprint).
services:
  - type: web
    name: monze-farm-link
    runtime: docker
    rootDir: monze_farm_link
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # No DATABASE_URL override here on purpose: the free tier has no
    # persistent disk, so this uses the app's default SQLite file inside the
    # container's own writable directory (survives restarts, wiped on every
    # redeploy). If you attach a paid persistent disk (e.g. mounted at
    # /var/data), set DATABASE_URL to sqlite:////var/data/monze_farm_link.db
    # so data survives redeploys too, or point it at a managed Postgres
    # instance instead for real production use.
