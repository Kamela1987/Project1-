name: Deploy Kenstar General Dealers site

on:
  push:
    branches: [main]
    paths:
      - "kenstar-general-dealers/**"
      - ".github/workflows/kenstar-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site (exclude internal templates)
        run: |
          mkdir -p _site
          rsync -a --exclude 'templates' --exclude 'README.md' kenstar-general-dealers/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
