name: Tech news digest

# Manual-only for now: the schedule trigger is disabled because SMTP secrets
# aren't configured yet, and a scheduled run failing every 2 hours meant a
# GitHub failure-notification email every 2 hours too. Run it from the Actions
# tab (or re-add a "schedule:" block below) once NEWS_EMAIL_TO/SMTP_USER/
# SMTP_PASSWORD are set as repository secrets.
on:
  workflow_dispatch:          # lets you run it on demand from the GitHub website

concurrency:
  group: tech-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and email the digest
        env:
          NEWS_EMAIL_TO: ${{ secrets.NEWS_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 tech_news_zambia.py --email

      # Runs even if the email failed, so the digest is still downloadable from the run page.
      - name: Upload the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-news-digest
          path: |
            digests/latest.txt
            digests/latest.html
          retention-days: 14
          if-no-files-found: ignore
