name: Tech news digest

# Manual-only for now: re-add a "schedule:" block below once you want this
# running unattended. Email is sent only when NEWS_EMAIL_TO/SMTP_USER/
# SMTP_PASSWORD are set as repository secrets — without them this just
# fetches and uploads the digest instead of failing the run.
on:
  workflow_dispatch:          # lets you run it on demand from the GitHub website

concurrency:
  group: tech-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether SMTP secrets are configured
        id: smtp
        run: |
          if [ -n "${{ secrets.NEWS_EMAIL_TO }}" ] && [ -n "${{ secrets.SMTP_USER }}" ] && [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and email the digest
        if: steps.smtp.outputs.configured == 'true'
        env:
          NEWS_EMAIL_TO: ${{ secrets.NEWS_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 tech_news_zambia.py --email

      # SMTP secrets aren't set yet - just fetch the digest so the run still
      # succeeds and the artifact is still downloadable below.
      - name: Fetch the digest (no email — secrets not configured)
        if: steps.smtp.outputs.configured != 'true'
        run: python3 tech_news_zambia.py

      # Runs even if the email failed, so the digest is still downloadable from the run page.
      - name: Upload the digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-news-digest
          path: |
            digests/latest.txt
            digests/latest.html
          retention-days: 14
          if-no-files-found: ignore
