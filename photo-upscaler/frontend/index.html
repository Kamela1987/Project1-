<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photo Upscaler</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Photo Upscaler</h1>
      <p>Upload up to 50 photos at once. Get back sharper, denoised, higher-resolution
        versions with a phone-style tone grade. This enhances detail with AI &mdash; it
        doesn't recover information the original camera never captured.</p>
    </header>

    <section id="drop-zone" class="drop-zone">
      <input id="file-input" type="file" accept="image/png, image/jpeg, image/webp" multiple hidden />
      <p id="drop-label">Drag &amp; drop up to 50 images, or click to choose</p>
      <label class="checkbox">
        <input id="restore-faces" type="checkbox" checked />
        Restore faces (recommended for portraits)
      </label>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="batch-actions" class="batch-actions" hidden>
      <button id="download-all-btn" type="button">Download all as ZIP</button>
    </section>

    <section id="queue" class="queue"></section>
  </main>

  <script src="vendor/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
