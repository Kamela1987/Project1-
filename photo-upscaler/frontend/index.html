<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photo Upscaler</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Photo Upscaler</h1>
      <p>Upload a photo. Get back a sharper, denoised, higher-resolution version with a
        phone-style tone grade. This enhances detail with AI &mdash; it doesn't recover
        information the original camera never captured.</p>
    </header>

    <section id="drop-zone" class="drop-zone">
      <input id="file-input" type="file" accept="image/png, image/jpeg, image/webp" hidden />
      <p id="drop-label">Drag & drop an image, or click to choose one</p>
      <label class="checkbox">
        <input id="restore-faces" type="checkbox" checked />
        Restore faces (recommended for portraits)
      </label>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="result" class="result" hidden>
      <div class="compare">
        <figure>
          <figcaption>Original</figcaption>
          <img id="original-img" alt="Original upload" />
        </figure>
        <figure>
          <figcaption>Enhanced</figcaption>
          <img id="enhanced-img" alt="Enhanced result" />
        </figure>
      </div>
      <a id="download-link" download="enhanced.jpg">Download enhanced image</a>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
